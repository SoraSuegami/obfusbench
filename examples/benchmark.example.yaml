id: "Example iO Implementation"
authors:
  - Alice Example
  - Bob Example
developers:
  - Carol Developer
  - Dave Developer
# Link to the paper / writeup describing the construction (optional).
paper_url: "https://eprint.iacr.org/2024/000"
# Link to the implementation source code (optional). When this is a GitHub repo
# and `commit` is set, the detail page links the commit.
implementation_url: "https://github.com/example/io-impl"
commit: "abc1234"
date: "2026-01-15"
# Target id from config/site.yaml (e.g. "obfuscated-prf-110" or
# "witness-encryption-64"). Omitting it assigns the first configured target.
target: "obfuscated-prf-110"
# Short GPU id the benchmark ran on (see config/gpu_devices.yaml, e.g. H100,
# H200, A100). Cost is derived automatically as the device's hourly price x
# total time, so it is not specified here.
device: "H100"
# Latency is in minutes (preferred). You may instead give it in seconds as
# obfuscation_latency_sec / evaluation_latency_sec; it is converted to minutes
# (divided by 60) at load time. Provide only one unit per phase.
obfuscation_latency_min: 2.06
obfuscation_total_time_hours: 1.5
obfuscation_peak_memory_gb: 48.0
storage_gb: 512.0
evaluation_latency_min: 0.007
evaluation_total_time_hours: 0.02
evaluation_peak_memory_gb: 2.5

# Optional: per-step breakdowns shown on the detail page as a 100% stacked bar
# plus a share table. The <phase1>/<phase2> tokens follow the target (see the
# table in CONTRIBUTING.md). Sub-steps may sum to less than the phase total; the
# remainder renders as an "Other" slice. Omit any block you don't have.
#
# obfuscation_time_breakdown:   # where <phase1> total time goes
#   - step: "Trapdoor sampling"
#     time_hours: 0.9
#   - step: "Matrix encoding"
#     time_hours: 0.4
# evaluation_time_breakdown:    # where <phase2> total time goes
#   - step: "Matrix products"
#     time_hours: 0.015
# obfuscation_size_breakdown:   # what makes up <size>
#   - component: "Encoded matrices"
#     size_gb: 400.0
#   - component: "Public parameters"
#     size_gb: 112.0
