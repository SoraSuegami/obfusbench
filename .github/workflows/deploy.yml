name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Hourly rebuild so the live site picks up current RunPod GPU prices.
    # Offset from :00 because exact-hour crons are the most delayed/dropped.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once (e.g. a push and the hourly schedule overlapping).
concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Validate benchmarks
        run: python -m sitegen validate

      - name: Build site
        # Fetches live RunPod prices at build time. The pricing query is public
        # (no auth required), so RUNPOD_API_KEY is optional and kept only as a
        # safety net in case RunPod starts requiring auth. If the fetch fails,
        # cost renders as ND (there is no committed fallback price).
        run: python -m sitegen build --output site
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
